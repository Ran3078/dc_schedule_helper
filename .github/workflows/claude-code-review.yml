name: Code Review

# 每個 PR 自動跑一次 AI 審查（見官方文件 code.claude.com/docs/en/github-actions
# 的「Run a skill」範例）。只留 inline comment／摘要留言，不產生會卡合併的
# required check——master 唯一的合併關卡仍是 ci.yml 的 test job（見 README
# 「CI／分支保護」章節）。draft PR、已經留過言的 PR 會被 Claude 自動跳過。
#
# 認證用 CLAUDE_CODE_OAUTH_TOKEN（既有 Claude 訂閱額度，不另外計費）——
# 這組 token 要在自己的終端機跑 `claude setup-token` 產生，貼進 GitHub
# repo secret，兩步都不透過任何自動化工具（token 是敏感憑證）。
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
